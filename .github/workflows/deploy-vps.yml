name: Deploy aipass.me to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aipassme-production
  cancel-in-progress: true

env:
  VPS_PREVIEW_ORIGIN: http://72.11.133.197

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy site files to 1Panel
        env:
          PANEL_BASE: ${{ secrets.PANEL_BASE }}
          PANEL_ENTRANCE: ${{ secrets.PANEL_ENTRANCE }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          PANEL_TARGET_DIR: ${{ secrets.PANEL_TARGET_DIR }}
        run: |
          node ./scripts/deploy-to-1panel.mjs

      - name: Ensure recharge API proxy in OpenResty
        env:
          PANEL_BASE: ${{ secrets.PANEL_BASE }}
          PANEL_ENTRANCE: ${{ secrets.PANEL_ENTRANCE }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          PANEL_TARGET_DIR: ${{ secrets.PANEL_TARGET_DIR }}
        run: |
          node ./scripts/deploy-recharge-proxy-1panel.mjs

      - name: Verify VPS homepage preview
        run: |
          curl -fsSL -H 'Host: aipass.me' "${VPS_PREVIEW_ORIGIN}/" > /tmp/aipass-home.html
          grep -q '光年升级计划｜嘉哥AI的 ChatGPT Plus 激活码开通服务' /tmp/aipass-home.html
          grep -q '立即购买 Plus 激活码 ¥198' /tmp/aipass-home.html

      - name: Verify VPS blog preview
        run: |
          curl -fsSL -H 'Host: aipass.me' "${VPS_PREVIEW_ORIGIN}/blog/" > /tmp/aipass-blog.html
          grep -q 'ChatGPT Plus 开通问题指南｜光年升级计划 · 嘉哥' /tmp/aipass-blog.html
          grep -q '光年升级计划的 ChatGPT Plus 开通问题指南' /tmp/aipass-blog.html

      - name: Verify VPS activate preview
        run: |
          curl -fsSL -H 'Host: aipass.me' "${VPS_PREVIEW_ORIGIN}/activate/" > /tmp/aipass-activate.html
          grep -q '<link rel="canonical" href="https://www.aipass.me/activate/">' /tmp/aipass-activate.html
          grep -q '<title>光年升级 Plus 激活中心｜激活码自助开通</title>' /tmp/aipass-activate.html

      - name: Verify recharge API proxy
        run: |
          curl -sS -D /tmp/aipass-recharge-provider.headers -o /tmp/aipass-recharge-provider.json https://aipass.me/api/recharge/provider
          grep -qi '^content-type: application/json' /tmp/aipass-recharge-provider.headers
          grep -q '"success":true' /tmp/aipass-recharge-provider.json

          curl -sS -D /tmp/aipass-verify-card.headers -o /tmp/aipass-verify-card.json \
            -X POST https://aipass.me/api/recharge/verify-card \
            -H 'Content-Type: application/json' \
            --data '{"cardInfo":"AIPASS_SMOKE_TEST_DO_NOT_USE","provider":"sange"}'
          grep -qi '^content-type: application/json' /tmp/aipass-verify-card.headers
          grep -q '"provider":"sange"' /tmp/aipass-verify-card.json
          grep -q '"CARD_NOT_FOUND"' /tmp/aipass-verify-card.json

      - name: Verify Jiage entrance page preview
        run: |
          curl -fsSL -H 'Host: aipass.me' "${VPS_PREVIEW_ORIGIN}/jiage-ai-gpt/" > /tmp/aipass-jiage.html
          grep -q '嘉哥AI / 嘉哥GPT 官方入口｜光年升级计划' /tmp/aipass-jiage.html
          grep -q '你看到的嘉哥AI / 嘉哥GPT，对应官网就是光年升级计划' /tmp/aipass-jiage.html
